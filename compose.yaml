services:
  flow:
    image: ghcr.io/trick77/flow:latest
    # docker compose up --build builds it from this checkout instead.
    build:
      context: .
      dockerfile: backend/Containerfile
    # distroless nonroot's own uid, never 1000 (the host's first user). Host
    # ./data must belong to it: sudo chown -R 65532:65532 data
    user: "65532:65532"
    restart: unless-stopped
    # BACKEND_* settings beyond the ones below. Values exported in the shell
    # are not forwarded. Needs Docker Compose 2.24+ (env_file `path`).
    env_file:
      - path: .env
        required: false
    environment:
      BACKEND_ADDR: ":8080"
      BACKEND_LOG_LEVEL: "${BACKEND_LOG_LEVEL:-info}"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "/flow", "healthcheck"]
      interval: 60s
      timeout: 5s
      start_period: 30s
      start_interval: 5s
      retries: 3
