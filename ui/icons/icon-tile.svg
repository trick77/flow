<!--
  Source for an apple-touch-icon. Not shipped: ui/icons/ is outside Vite's
  publicDir, so nothing here is copied into the bundle, and no PNG is made
  from it yet (iOS takes only a raster apple-touch-icon). Why an opaque
  #1f1f1e ground and square corners: see ../trakk's ui/icons/icon-tile.svg.

  Same glyph, weight, inner scale 0.5625 and translate 5.25 as
  ../public/icon.svg; see that file for the departures from Iconoir and the
  derived transform formulas. Only the outer transform differs: coverage C is
  0.60, so scale 64*0.6/18 = 2.13333 and translate 32 - 12*2.13333 = 6.4.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <linearGradient id="og" x1="0" y1="0" x2="0.72" y2="1">
    <stop offset="0" stop-color="#e08a68"/>
    <stop offset="1" stop-color="#c25f34"/>
  </linearGradient>
  <rect width="64" height="64" fill="#1f1f1e"/>
  <g transform="translate(6.4000 6.4000) scale(2.13333)">
    <rect x="3" y="3" width="18" height="18" rx="4" fill="url(#og)"/>
    <g transform="translate(5.25 5.25) scale(0.5625)">
      <g fill="none" stroke="#1f1f1e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <path d="M7 5V19"/>
        <path d="M17 5V8C17 9.5 16.5 10.5 15.5 11.5L9 18"/>
      </g>
      <g fill="#1f1f1e">
        <circle cx="7" cy="5" r="3.5"/>
        <circle cx="17" cy="5" r="3.5"/>
        <circle cx="7" cy="19" r="3.5"/>
      </g>
    </g>
  </g>
</svg>
