<!--
  Flow's icon: a fork, two nodes on top, one below, on the family's shaded
  chip. Construction as in ../trakk's ui/public/icon.svg (chip, gradient, the
  mark painted in the bg token #1f1f1e rather than knocked through, weight 3.0,
  inner scale 0.5625 so one glyph unit is half a pixel at 16px and x, y map to
  pixel 8 + (v - 12)/2); read that file for the shared argument. What follows
  is only what this glyph needs.

  THE GLYPH IS Iconoir's "git-fork" (MIT), copied rather than imported. Three
  departures, each for the 16px raster:

  1. THE NODES ARE FILLED DOTS OF RADIUS 3.5, not rings of radius 2. At weight
     3.0 a radius-2 ring closes to a blot with a one-pixel hole that reads as
     dirt at 16px; rings of radius 3 keep the hole but their outer edges run
     into each other between the two top nodes. Radius 3.5 (1.75 px at 16px)
     gives three solid pixels across with a light fringe and matches the
     stroke's visual weight at 64px; 3.0 looked thin beside the stem, 4.0 left
     only a grey pixel between the top pair.
  2. THE BRANCH RUNS AT 45 DEGREES from the top right node into the stem just
     above the bottom node: "M17 5V8C17 9.5 16.5 10.5 15.5 11.5L9 18", not
     Iconoir's shallow run that bends down beside the stem. That run lies two
     units from the stem from y 13 to 17: at 3.0 the two strokes overlap and at
     16px they fuse into one dark bar. A 45-degree line rasterises as a clean
     one-pixel staircase; the short bend at the top keeps the curve out of
     the node.
  3. THE STEM RUNS NODE CENTRE TO NODE CENTRE (M7 5V19), since filled dots
     cover its ends. Node centres and the stem stay on Iconoir's x 7 and 17,
     y 5 and 19: all odd, so each lands on a pixel centre (x 7 -> 5.5, x 17
     -> 10.5, y 5 -> 4.5, y 19 -> 11.5). Nothing had to move for the raster.

  Bbox with the dots: x[3.5,20.5] y[1.5,22.5], centre (12,12), 21 units tall:
  65.6 % of the chip, as Trakk's. Centre 12 is even, which is what keeps the
  odd-coordinate rule true with this glyph; a centre off an even unit shifts
  every stroke by a fraction of a pixel. Derived transforms (coverage C 1.0):

    outer: scale = 64*1.0/18 = 3.55556,  translate = 32 - 12*3.55556 = -10.6667
    inner: scale = 0.5625,              translate = 12 - 12*0.5625 = 5.25

  TRANSPARENT CANVAS: only the four corners outside the chip's radius are clear.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <linearGradient id="og" x1="0" y1="0" x2="0.72" y2="1">
    <stop offset="0" stop-color="#e08a68"/>
    <stop offset="1" stop-color="#c25f34"/>
  </linearGradient>
  <g transform="translate(-10.6667 -10.6667) scale(3.55556)">
    <rect x="3" y="3" width="18" height="18" rx="4" fill="url(#og)"/>
    <g transform="translate(5.25 5.25) scale(0.5625)">
      <g fill="none" stroke="#1f1f1e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <path d="M7 5V19"/>
        <path d="M17 5V8C17 9.5 16.5 10.5 15.5 11.5L9 18"/>
      </g>
      <g fill="#1f1f1e">
        <circle cx="7" cy="5" r="3.5"/>
        <circle cx="17" cy="5" r="3.5"/>
        <circle cx="7" cy="19" r="3.5"/>
      </g>
    </g>
  </g>
</svg>
